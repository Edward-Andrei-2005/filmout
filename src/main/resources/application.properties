spring.application.name=filmout
logging.level.org.springframework.web=DEBUG
spring.mustache.suffix=.html
logging.level.es.urjc=TRACE

# Recargar plantillas sin reiniciar
spring.thymeleaf.cache=false

# --- INICIALIZACION DE DATOS SQL ---
# Hibernate actualiza el esquema primero, luego se ejecutan schema.sql y data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# ================================================================
# BASE DE DATOS LOCAL H2 (ACTIVA POR DEFECTO)
# ================================================================
spring.datasource.url=jdbc:h2:mem:filmoutdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola web de H2 (accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================================================
# ESQUELETO PARA BASE DE DATOS MySQL (LOCAL O EXTERNA)
# Para usar MySQL: comenta el bloque de H2 superior, descomenta este
# y sustituye los valores por los de tu servidor MySQL.
# ================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/filmoutdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=tu_usuario
# spring.datasource.password=tu_contraseña
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

