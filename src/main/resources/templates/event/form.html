<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>New Event - Filmout</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
<div id="auth" class="auth active">
    <div class="auth-panel" style="max-width:500px;">

        <div class="auth-logo">
            <span class="logo-film">FILM</span><span class="logo-out">OUT</span>
        </div>

        {{#movie}}
        <div class="movie-selected movie-selected-header">
            <img src="https://image.tmdb.org/t/p/w92{{posterPath}}" alt="{{title}}" class="movie-selected-poster" />
            <div>
                <span class="movie-selected-title">{{title}}</span>
                <span class="movie-selected-year">{{year}}</span>
            </div>
        </div>
        {{/movie}}

        <h2 class="auth-title">New Event</h2>

        {{#error}}
        <div class="auth-message auth-error">{{error}}</div>
        {{/error}}

        <form method="post" action="/events/new">

            {{#movie}}
            <input type="hidden" name="movieId" value="{{apiId}}" />
            {{/movie}}

            <div class="field-group">
                <label for="new-description">Description</label>
                <input type="text" id="new-description" name="description" placeholder="What's the plan?" required />
            </div>

            <div class="field-group">
                <label for="new-date">Date & time</label>
                <input type="datetime-local" id="new-date" name="date" required />
            </div>

            <div class="field-group">
                <label for="new-maxAttendees">Max attendees</label>
                <input type="number" id="new-maxAttendees" name="maxAttendees" min="2" max="50" placeholder="2" required />
            </div>

            <div class="field-group">
                <label for="new-location">Cinema</label>
                <select id="new-location" name="location" class="field-select" required>
                    <option value="" disabled selected>Select a cinema</option>
                    {{#cinemas}}
                    <option value="{{name}}">{{name}}</option>
                    {{/cinemas}}
                </select>
            </div>

            <button type="submit" class="btn-primary full">Create event</button>

        </form>

        <a href="/" class="btn-primary btn-secondary full" style="display:block; text-align:center; text-decoration:none; margin-top:12px;">Cancel</a>

    </div>
</div>
</body>

</html>
