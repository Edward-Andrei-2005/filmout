<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Event - Filmout</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="auth" class="auth active">
    <div class="auth-panel" style="max-width:500px;">

      <div class="auth-logo">
        <span class="logo-film">FILM</span><span class="logo-out">OUT</span>
      </div>

      {{#event}}
      {{#movie}}
      <div class="movie-selected movie-selected-header">
        <img src="https://image.tmdb.org/t/p/w92{{posterPath}}" alt="{{title}}" class="movie-selected-poster" />
        <div>
          <span class="movie-selected-title">{{title}}</span>
          <span class="movie-selected-year">{{year}}</span>
        </div>
      </div>
      {{/movie}}

      <h2 class="auth-title">Event Details</h2>

      <div class="field-group">
        <label>Description</label>
        <p class="profile-value">{{description}}</p>
      </div>

      <div class="field-group">
        <label>Cinema</label>
        <p class="profile-value">📍 {{location}}</p>
      </div>

      <div class="field-group">
        <label>Date & time</label>
        <p class="profile-value">🕒 {{date}}</p>
      </div>

      <div class="field-group">
        <label>Attendees</label>
        <p class="profile-value">👥 {{attendeeCount}} / {{maxAttendees}}</p>
      </div>

      {{/event}}

      {{#isAdmin}}
      <a href="/events/{{eventId}}/edit" class="btn-primary full" style="display:block; text-align:center; text-decoration:none; margin-top:8px;">✏️ Edit event</a>
      <form method="post" action="/events/{{eventId}}/delete" style="margin-top:8px;">
        <button type="submit" class="btn-primary btn-danger full">🗑️ Delete event</button>
      </form>
      {{/isAdmin}}

      {{#canJoin}}
      <form method="post" action="/events/{{eventId}}/join" style="margin-top:8px;">
        <button type="submit" class="btn-primary full">✅ Join event</button>
      </form>
      {{/canJoin}}

      {{#canLeave}}
      <form method="post" action="/events/{{eventId}}/leave" style="margin-top:8px;">
        <button type="submit" class="btn-primary btn-secondary full">❌ Leave event</button>
      </form>
      {{/canLeave}}

      <a href="/events" class="btn-primary btn-secondary full" style="display:block; text-align:center; text-decoration:none; margin-top:12px;">Back to events</a>

    </div>
  </div>
</body>

</html>
