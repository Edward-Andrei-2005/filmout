<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="auth" class="auth active">
    <div class="auth-panel">

      <div class="auth-logo">
        <span class="logo-film">FILM</span><span class="logo-out">OUT</span>
        <div class="logo-tagline">El cine es mejor en compañía</div>
      </div>

      <div id="auth-register" class="auth-form active">
        <h2 class="auth-title">Crear cuenta</h2>

        {{#error}}
        <div class="auth-message auth-error">{{error}}</div>
        {{/error}}

        <form method="post" action="/register">

          <div class="field-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Nombre de usuario" required />
          </div>

          <div class="field-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="tu@email.com" required />
          </div>

          <div class="field-group">
            <label>Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required />
          </div>

          <div class="field-group">
            <label>Confirmar contraseña</label>
            <input type="password" name="confirmPassword" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn-primary full">Crear cuenta</button>

        </form>

        <p class="auth-switch">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
      </div>

    </div>
  </div>
</body>

</html>
