<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Account - Filmout</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
<div id="auth" class="auth active">
    <div class="auth-panel">

        <div class="auth-logo">
            <span class="logo-film">FILM</span><span class="logo-out">OUT</span>
            <div class="logo-tagline">The movie experience, better together</div>
        </div>

        <div id="auth-register" class="auth-form active">
            <h2 class="auth-title">Create Account</h2>

            {{#error}}
            <div class="auth-message auth-error">{{error}}</div>
            {{/error}}

            <form method="post" action="/register">

                <!-- Username  -->
                <div class="field-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Your username" required />
                </div>

                <!-- Email -->
                <div class="field-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@email.com" required />
                </div>

                <!-- Password -->
                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required />
                </div>

                <!-- Confirm Password -->
                <div class="field-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn-primary full">Create Account</button>

            </form>

            <p class="auth-switch">Already have an account? <a href="/login">Login</a></p>
        </div>

    </div>
</div>
</body>

</html>
