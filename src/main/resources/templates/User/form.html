<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>My Profile - Filmout</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="auth" class="auth active">
    <div class="auth-panel">

      <div class="auth-logo">
        <span class="logo-film">FILM</span><span class="logo-out">OUT</span>
      </div>

      {{#loggedUser}}
      <h2 class="auth-title">My Profile</h2>

      {{#success}}
      <div class="auth-message auth-success">{{success}}</div>
      {{/success}}

      {{#error}}
      <div class="auth-message auth-error">{{error}}</div>
      {{/error}}

      <form method="post" action="/profile">

        <div class="field-group">
          <label>Username</label>
          <input type="text" name="username" value="{{userName}}" required />
        </div>

        <div class="field-group">
          <label>Email</label>
          <input type="email" name="email" value="{{email}}" required />
        </div>

        <div class="field-group">
          <label>New Password <span class="field-optional">(leave blank to keep current)</span></label>
          <input type="password" name="password" placeholder="••••••••" />
        </div>

        <button type="submit" class="btn-primary full">Save changes</button>

      </form>
      {{/loggedUser}}

      <a href="/home" class="btn-primary btn-secondary full" style="display:block; text-align:center; text-decoration:none; margin-top:12px;">Back to Home</a>

      {{#loggedUser}}
      <form method="post" action="/profile/delete" style="margin-top:8px;">
        <button type="submit" class="btn-primary btn-danger full">🗑️ Delete account</button>
      </form>
      {{/loggedUser}}

    </div>
  </div>
</body>

</html>
